[build-system]
requires = ["scikit-build-core>=0.10,<0.13", "nanobind>=1.3.1", "packaging<26"]
build-backend = "scikit_build_core.build"

[project]
name = "py-osrm-revival"
# IMPORTANT: Version must match git tags for release workflow (e.g., version "0.1.0" → tag "v0.1.0")
version = "0.1.0"
description = "Python bindings for the osrm-backend project (actively maintained fork)"
readme = "README.md"
dependencies = ["aiohttp>=3.8", "tqdm>=4.0"]
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]


[project.urls]
repository = "https://github.com/nick-fournier/py-osrm"
"Original project" = "https://github.com/gis-ops/py-osrm"
"osrm-backend repository" = "https://github.com/Project-OSRM/osrm-backend"

[tool.scikit-build]
minimum-version = "0.5"
build-dir = "build/{wheel_tag}"

# Explicitly specify what to install
wheel.packages = ["src/osrm"]

# Editable install configuration
editable.mode = "redirect"
editable.verbose = true

[tool.cibuildwheel]
archs = ["native"]
build = "cp3{9,10,11,12}-*"
build-verbosity = 1
skip = "*musllinux*"
manylinux-x86_64-image = "ghcr.io/gis-ops/manylinux:2_28_osrm_python"
test-requires = "pytest"
test-command = "cd {project}/tests/data && make && python -m osrm datastore {project}/tests/data/ch/monaco && pytest {project}/tests"

[tool.cibuildwheel.linux]
build = "cp3{9,10,11,12}-*"
before-all = """
  rpm --import https://repo.almalinux.org/almalinux/RPM-GPG-KEY-AlmaLinux || true
  yum install -y tbb-devel bzip2-devel wget tar pkgconfig expat-devel zlib-devel lua-devel
  
  # Build newer Boost from source for BoostConfig.cmake support
  cd /tmp
  wget --no-check-certificate -O boost_1_85_0.tar.gz https://sourceforge.net/projects/boost/files/boost/1.85.0/boost_1_85_0.tar.gz/download
  tar xzf boost_1_85_0.tar.gz
  cd boost_1_85_0
  ./bootstrap.sh --with-libraries=date_time,filesystem,iostreams,program_options,regex,system,thread,test
  ./b2 install --prefix=/usr/local -j$(nproc) link=static,shared cxxflags=-fPIC cflags=-fPIC
  cd /tmp && rm -rf boost_1_85_0*
"""
environment = { LD_LIBRARY_PATH="$LD_LIBRARY_PATH:/usr/local/lib:/usr/local/lib/intel64/gcc4.8/", PKG_CONFIG_PATH="/usr/lib64/pkgconfig:/usr/local/lib/pkgconfig" }
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
environment = "MACOSX_DEPLOYMENT_TARGET=15.0"
before-all = """
  export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
  brew install lua@5.4 tbb boost@1.85
  brew link boost@1.85
"""
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
test-command = "python -m osrm datastore {project}/tests/data/ch/monaco && pytest {project}/tests"
repair-wheel-command = "python -m pip install delvewheel && python -c \"import os,sys,subprocess,glob; base=sys.base_prefix; paths=[base, os.path.join(base,'DLLs')]; paths += glob.glob(r'{project}\\\\build\\\\*\\\\vcpkg_installed\\\\x64-windows\\\\bin'); args=['delvewheel','repair']; [args.extend(['--add-path',p]) for p in paths if os.path.isdir(p)]; args += ['-w',r'{dest_dir}',r'{wheel}']; subprocess.check_call(args)\""


[tool.cibuildwheel.windows.environment]
CMAKE_TOOLCHAIN_FILE = "C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
VCPKG_MANIFEST_DIR = "{project}"
VCPKG_DEFAULT_TRIPLET = "x64-windows"


[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
